# The iPad app's Xcode project, made by XcodeGen: `./ios/build.sh` runs it. The project file itself is not in Git.
# The app target is only the bundle (Info.plist, icon, main.swift); all code comes from the Swift package one
# folder up, through its library AmpBenchPad.
# The target and its bundle are called AmpBenchApp: the package already has a scheme "AmpBench" (the Mac app) and a
# module "AmpBenchPad" (the iPad's code). On the iPad's home screen the app is "AmpBench" (CFBundleDisplayName).
name: AmpBenchPad
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  AmpBench:
    path: ..
targets:
  AmpBenchApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AmpBench
        product: AmpBenchPad
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPad only.
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - AmpBenchAppUITests
  # Drives the real app in the simulator with made-up presets and a simulated amp: `./ios/build.sh --test`.
  AmpBenchAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AmpBenchApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(AMPBENCH_BUNDLE_ID).uitests
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: AmpBenchApp
